installerInfo: '{ "productId": "OnPremObservability-Datadog/1.0.0", "features": [ { "featureId": "ArtifactoryVersion/{{ default .Chart.AppVersion .Values.artifactory.image.version }}" }, { "featureId": "{{ if .Values.postgresql.enabled }}postgresql{{ else }}{{ .Values.database.type }}{{ end }}/0.0.0" }, { "featureId": "Platform/{{ default "kubernetes" .Values.installer.platform }}" },  { "featureId": "Channel/OnPremObservability-Datadog-Helm" } ] }'
artifactory:
  # For Artifactory versions <= 7.86.x please use artifactory.openMetrics.enabled instead of artifactory.metrics.enabled
  metrics:
    enabled: true
  customInitContainersBegin: |
    - name: "download-fluentd-conf-on-persistent-volume"
      image: {{ include "artifactory.getImageInfoByValue" (list . "initContainers") }}
      imagePullPolicy: "{{ .Values.artifactory.image.pullPolicy }}"
      command:
        - 'sh'
        - '-c'
        - >
          mkdir -p {{ .Values.artifactory.persistence.mountPath }}/etc/fluentd/;
          curl https://raw.githubusercontent.com/jfrog/log-analytics-datadog/master/fluent.conf.rt -o {{ .Values.artifactory.persistence.mountPath }}/etc/fluentd/fluentd.conf;
      volumeMounts:
        - mountPath: "{{ .Values.artifactory.persistence.mountPath }}"
          name: artifactory-volume
  customSidecarContainers: |
    - name: "artifactory-fluentd-sidecar"
      image: "releases-docker.jfrog.io/fluentd:4.22"
      imagePullPolicy: "IfNotPresent"
      volumeMounts: 
        - mountPath: "{{ .Values.artifactory.persistence.mountPath }}"
          name: artifactory-volume
      env:
        - name: JF_PRODUCT_DATA_INTERNAL
          value: {{ .Values.artifactory.persistence.mountPath }}
        - name: JPD_URL
          value: {{ .Values.jfrog.observability.jpd_url }}
        - name: JPD_ADMIN_USERNAME
          value: {{ .Values.jfrog.observability.username }}
        - name: JFROG_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: jfrog-admin-token
              key: token
        - name: COMMON_JPD
          value: {{ .Values.jfrog.observability.common_jpd | quote }}
        - name: DATADOG_API_KEY
          value: {{ .Values.datadog.api_key }}
        - name: DATADOG_API_HOST
          value: {{ .Values.datadog.api_host }}
        - name: DATADOG_VERIFY_SSL
          value: {{ .Values.datadog.verify_ssl | quote}}
        - name: DATADOG_COMPRESS_DATA
          value: {{ .Values.datadog.compress_data | quote }}
        - name: LOG_ENV
          value: {{ .Values.jfrog.observability.log_env | default "staging" | quote }}
        - name: FLUENTD_CONF
          value: ../../../..{{ .Values.artifactory.persistence.mountPath }}/etc/fluentd/fluentd.conf
# Log-forwarding only sidecar for the frontend pod. Platform metrics and callhome are
# collected once by the artifactory pod's sidecar, so JPD_URL / JPD_ADMIN_USERNAME /
# JFROG_ADMIN_TOKEN / COMMON_JPD / DATADOG_COMPRESS_DATA / DATADOG_VERIFY_SSL are
# deliberately omitted here.
frontend:
  customInitContainers: |
    - name: "download-fluentd-conf-on-frontend"
      image: {{ include "artifactory.getImageInfoByValue" (list . "initContainers") }}
      imagePullPolicy: "{{ .Values.initContainers.image.pullPolicy }}"
      {{- if .Values.frontend.containerSecurityContext.enabled }}
      securityContext: {{- omit .Values.frontend.containerSecurityContext "enabled" | toYaml | nindent 4 }}
      {{- end }}
      command:
        - 'sh'
        - '-c'
        - >
          mkdir -p {{ .Values.frontend.persistence.mountPath }}/etc/fluentd/;
          curl -fsSL https://raw.githubusercontent.com/jfrog/log-analytics-datadog/master/fluent.conf.rt.frontend -o {{ .Values.frontend.persistence.mountPath }}/etc/fluentd/fluentd.conf;
      volumeMounts:
        - mountPath: "{{ .Values.frontend.persistence.mountPath }}"
          name: data
  customSidecarContainers: |
    - name: "frontend-fluentd-sidecar"
      image: "releases-docker.jfrog.io/fluentd:4.22"
      imagePullPolicy: "IfNotPresent"
      {{- if .Values.frontend.containerSecurityContext.enabled }}
      securityContext: {{- omit .Values.frontend.containerSecurityContext "enabled" | toYaml | nindent 4 }}
      {{- end }}
      volumeMounts:
        - mountPath: "{{ .Values.frontend.persistence.mountPath }}"
          name: data
      env:
        - name: JF_PRODUCT_DATA_INTERNAL
          value: {{ .Values.frontend.persistence.mountPath }}
        - name: DATADOG_API_KEY
          value: {{ .Values.datadog.api_key }}
        - name: DATADOG_API_HOST
          value: {{ .Values.datadog.api_host }}
        - name: LOG_ENV
          value: {{ .Values.jfrog.observability.log_env | default "staging" | quote }}
        - name: FLUENTD_CONF
          value: ../../../..{{ .Values.frontend.persistence.mountPath }}/etc/fluentd/fluentd.conf
